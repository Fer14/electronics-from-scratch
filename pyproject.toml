[project]
name = "electronics-from-scratch"
version = "0.1.0"
description = "Electronics from absolute zero: the words, the physics, circuits, semiconductors, digital logic, computers, microcontrollers, chip design and PCBs, with our own circuit simulator built from scratch."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]
